<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PerfectMarkD</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong colors.
      // Keep this logic in sync with src/theme/theme.ts (STORAGE_KEY).
      (() => {
        try {
          const stored = localStorage.getItem('perfectmarkd:theme');
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <!--
      The instance's analytics website id (launch/11), served by the
      deployment rather than baked into this bundle, so one published image
      serves every instance. Deferred, so it does not block first paint; the
      id is read when analytics initializes, on the app's first render, after
      this script and the module bundle have both loaded. See
      src/analytics/tracker.ts.
    -->
    <script defer src="/analytics-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
