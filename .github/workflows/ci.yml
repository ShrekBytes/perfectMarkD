name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser for the engine's real-Chromium golden suite (engine-port/08).
      # Pinned to the same version the devDependency expects.
      - name: Install Playwright Chromium
        run: pnpm --filter @perfectmarkd/core exec playwright install chromium --with-deps

      # First because it is the cheapest check and the one most likely to be
      # forgotten locally: format:check drifted across 44 files for exactly as
      # long as it was absent from this file. Prettier's own rules about prose
      # and generated artifacts live in .prettierignore, so a failure here is a
      # real one — fix it with `pnpm format` rather than by widening the ignore.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Engine golden tests (real Chromium)
        run: pnpm --filter @perfectmarkd/core test:golden

      # Server Export e2e (server/03): same Chromium binary as the golden
      # suite; the config serves a fixture /export page for the worker.
      - name: Server Export e2e (real Chromium)
        run: pnpm --filter @perfectmarkd/server test:e2e

      # Web E2E smoke suite (editor-app/10): same Chromium binary as the
      # golden suite; the config builds apps/web and serves the bundle itself.
      - name: Web E2E smoke tests (real Chromium)
        run: pnpm --filter @perfectmarkd/web test:e2e
