name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser for the engine's real-Chromium golden suite (engine-port/08).
      # Pinned to the same version the devDependency expects.
      - name: Install Playwright Chromium
        run: pnpm --filter @perfectmarkd/core exec playwright install chromium --with-deps

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Engine golden tests (real Chromium)
        run: pnpm --filter @perfectmarkd/core test:golden
