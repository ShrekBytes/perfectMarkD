# PerfectMarkD deployment stack (server/06): Caddy serves the static web
# bundle on one origin and reverse-proxies /api to the api container; the
# export worker inside api loads the app's own /export page by looping back
# to Caddy over the internal network (ADR-0003).
#
#   cp .env.example .env   # fill in SESSION_SECRET + HISTORY_ENCRYPTION_KEY
#   docker compose up -d --build
#
# Production TLS: set SITE_ADDRESS=<domain> (Cloudflare DNS / VPS rollout is
# launch/04's ticket). api-data holds the SQLite db and the encrypted
# export-history files; caddy-data holds TLS certificates.

name: perfectmarkd

services:
  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    environment:
      # ":80" = plain HTTP for local runs; a domain enables automatic TLS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    # Mirrors the Dockerfile HEALTHCHECK so the caddy dependency wait works on
    # every runtime (podman's compat API hides image-level healthchecks).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required, see .env.example}
      HISTORY_ENCRYPTION_KEY: ${HISTORY_ENCRYPTION_KEY:?HISTORY_ENCRYPTION_KEY is required, see .env.example}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # The worker's Chromium loads the SPA's /export page from Caddy — the
      # same origin browsers use, so preview and PDF can never diverge.
      EXPORT_ORIGIN: http://caddy
      # Both live on the api-data volume: SQLite db + encrypted history.
      DB_PATH: /data/perfectmarkd.db
      HISTORY_DIR: /data/history
    volumes:
      - api-data:/data

volumes:
  api-data:
  caddy-config:
  caddy-data:
