# PerfectMarkD deployment stack (server/06): Caddy serves the static web
# bundle on one origin, reverse-proxies /api to the api container, and
# reverse-proxies /analytics to the self-hosted Umami instance (launch/01);
# the export worker inside api loads the app's own /export page by looping
# back to Caddy over the internal network (ADR-0003).
#
#   cp .env.example .env   # fill in SESSION_SECRET + HISTORY_ENCRYPTION_KEY
#                          # and the two UMAMI_* secrets
#   docker compose up -d --build     # dev checkout: builds the app images
#
# On a deployment host, build nothing (launch/10): the api and caddy images are
# published to GHCR by .github/workflows/images.yml, so
#
#   podman compose pull && podman compose up -d --no-build
#
# brings the stack up from the registry. Pin PERFECTMARKD_IMAGE_TAG to a
# `sha-…` tag for a reproducible deploy; the default is `latest`.
#
# Deployment (ADR-0010): the stack runs on the Admin's machine and
# is published at the domain through a Cloudflare Tunnel, which terminates TLS
# — so SITE_ADDRESS stays ":80" and caddy-data's ACME certificates go unused.
# Set SITE_ADDRESS=<domain> only for a directly-exposed host. api-data holds
# the SQLite db and the encrypted export-history files; umami-db-data holds
# the analytics database, which is disposable — losing it costs statistics,
# never user data, so launch/03's backup deliberately leaves it out.

name: perfectmarkd

services:
  caddy:
    # launch/10: the published image, so a deployment host pulls instead of
    # building. `build:` stays for a dev checkout — `up -d --build` builds and
    # tags the result as this ref, while `pull` + `up -d --no-build` uses the
    # published one. Both work from this one file (verified under podman
    # compose, which is why there is no second prod compose file).
    image: ghcr.io/shrekbytes/perfectmarkd-caddy:${PERFECTMARKD_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Where the tracker lives (launch/01). Baked in because the SPA is
        # static and every instance serves Umami at the same path; the
        # website id is *not* a build input — see ANALYTICS_WEBSITE_ID below.
        VITE_ANALYTICS_URL: ${VITE_ANALYTICS_URL:-/analytics}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    environment:
      # ":80" = plain HTTP for local runs; a domain enables automatic TLS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # The Umami website this instance reports to (launch/11). Caddy serves
      # it to the bundle at runtime on /analytics-config.js, so the same
      # published image collects for an instance that sets an id here and for
      # none that leaves it empty. Changing it needs a restart, not a rebuild.
      ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID:-}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  api:
    # launch/10: published for the same reason as caddy's — this image carries
    # headless Chromium and its apt dependencies, which is not something the
    # deployment host should be assembling.
    image: ghcr.io/shrekbytes/perfectmarkd-api:${PERFECTMARKD_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    # Mirrors the Dockerfile HEALTHCHECK so the caddy dependency wait works on
    # every runtime (podman's compat API hides image-level healthchecks).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required, see .env.example}
      HISTORY_ENCRYPTION_KEY: ${HISTORY_ENCRYPTION_KEY:?HISTORY_ENCRYPTION_KEY is required, see .env.example}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # AI Actions (ADR-0008): deployment-level provider key; unset means the
      # instance reports AI as unavailable (no key is ever stored in the db).
      AI_API_KEY: ${AI_API_KEY:-}
      # The worker's Chromium loads the SPA's /export page from Caddy over
      # the internal network — the loopback origin (http://caddy) exists so
      # the worker has one regardless of how the public site is served.
      EXPORT_ORIGIN: http://caddy
      # Both live on the api-data volume: SQLite db + encrypted history.
      DB_PATH: /data/perfectmarkd.db
      HISTORY_DIR: /data/history
      # The export queue's three knobs. apps/server/src/env.ts reads
      # all of them, but until now compose never forwarded them, so setting any
      # of them in .env did nothing at all. Left as the same empty-default
      # passthrough as ADMIN_EMAIL and AI_API_KEY above, so an unset value
      # reaches the server as empty and it applies its own default — the
      # numbers live in env.ts and nowhere else.
      #
      # EXPORT_CONCURRENCY is the one that matters on a small host: the
      # default is 2 renders in flight, each a headless Chromium, and a
      # 300-page document is not a small render.
      EXPORT_CONCURRENCY: ${EXPORT_CONCURRENCY:-}
      EXPORT_BURST_PER_MINUTE: ${EXPORT_BURST_PER_MINUTE:-}
      EXPORT_RENDER_TIMEOUT_MS: ${EXPORT_RENDER_TIMEOUT_MS:-}
    volumes:
      - api-data:/data

  # Self-hosted analytics (launch/01). Umami's BASE_PATH is a build-time
  # variable, so it can't be the upstream prebuilt image — but the deployment
  # host shouldn't be compiling a Next.js app either, so the image is built by
  # .github/workflows/umami-image.yml and pulled from GHCR (ADR-0012). The
  # package is public: no registry login needed. Keep the tag in sync with
  # UMAMI_VERSION in ops/umami/Dockerfile. To build it locally instead:
  #   docker build -t ghcr.io/shrekbytes/perfectmarkd-umami:3.4.0 ops/umami
  #
  # Deliberately not a dependency of caddy: analytics being down must never
  # keep the app from serving.
  umami:
    image: ghcr.io/shrekbytes/perfectmarkd-umami:${UMAMI_VERSION:-3.4.0}
    restart: unless-stopped
    init: true
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      # The base path is part of the route: umami answers /analytics/api/*,
      # not /api/* (upstream's own compose has no base path, hence the
      # difference).
      test:
        ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/analytics/api/heartbeat']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is required, see .env.example}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required, see .env.example}
      # Must match the value baked into the image (ops/umami/Dockerfile):
      # umami reads it at startup for its own routing and CSP.
      BASE_PATH: /analytics
      # The privacy posture (PLAN §1): the instance makes no outbound call of
      # its own — no telemetry, no update check, no favicon service — and
      # umami stores a salted hash of a visitor's address, never the address.
      PRIVATE_MODE: '1'
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
      # Umami filters bots by default, which is what you want in production
      # and is worth knowing when verifying: headless Chromium sends a UA
      # containing "HeadlessChrome", so an automated check reports 200 from
      # /analytics/api/send while storing nothing. Drive it with a real
      # browser UA (or set DISABLE_BOT_CHECK=1 locally) to see rows appear.

  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is required, see .env.example}
      # umami's own recommendation: UTC avoids regional-offset drift in the
      # event timestamps the dashboard reports.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  api-data:
  caddy-config:
  caddy-data:
  umami-db-data:
