<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quarterly Report</title>
<style>
      *, *::before, *::after { box-sizing: border-box; }
      @page { size: 794px 1123px; margin: 0; }
      html, body { margin: 0; padding: 0; background: #ffffff; }
      .mpdf-export-page {
        position: relative;
        width: 794px; height: 1123px;
        overflow: hidden;
        background: #ffffff;
        page-break-after: always; break-after: page;
      }
      .mpdf-export-page:last-child { page-break-after: avoid; break-after: avoid; }
      .mpdf-doc {
    font-family: Georgia, serif;
    font-size: 13px;
    line-height: 1.85;
    color: #1a1a2e;
    box-sizing: border-box;
    
  }
  .mpdf-doc *, .mpdf-doc *::before, .mpdf-doc *::after { box-sizing: border-box; }
  .mpdf-doc strong, .mpdf-doc b { font-weight: 700; font-style: normal; color: #1a1a2e; }
  .mpdf-doc h1 strong, .mpdf-doc h1 b,
  .mpdf-doc h2 strong, .mpdf-doc h2 b,
  .mpdf-doc h3 strong, .mpdf-doc h3 b,
  .mpdf-doc h4 strong, .mpdf-doc h4 b,
  .mpdf-doc h5 strong, .mpdf-doc h5 b,
  .mpdf-doc h6 strong, .mpdf-doc h6 b { color: inherit; }
  .mpdf-doc em, .mpdf-doc i { font-style: italic; font-weight: inherit; }
  .mpdf-doc mark { background: #ffe066; color: inherit; padding: 0 2px; border-radius: 2px; }
  .mpdf-doc del, .mpdf-doc s { text-decoration: line-through; }
  .mpdf-doc h1 {
    font-size: 22px;
    font-weight: 700;
    color: #0d0d1a;
    margin: 0 0 12px;
    line-height: 1.2;
    
    
  }
  .mpdf-doc h2 {
    font-size: 17px;
    font-weight: 600;
    color: #0d0d1a;
    margin: 20px 0 10px;
    border-bottom: 0.5px solid #7c6af755; padding-bottom: 5px;
  }
  .mpdf-doc h3 {
    font-size: 15px;
    font-weight: 700;
    color: #0d0d1a;
    margin: 16px 0 8px;
    letter-spacing: 0.01em;
  }
  .mpdf-doc h4 { font-size: 13px; font-weight: 700; color: #0d0d1a; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .mpdf-doc h5 { font-size: 12px; font-weight: 600; color: #0d0d1a; margin: 10px 0 4px; font-style: italic; }
  .mpdf-doc h6 { font-size: 11px; font-weight: 600; color: #1a1a2e; margin: 8px 0 4px; font-style: italic; opacity: 0.75; }
  .mpdf-doc p { margin: 0 0 0.65em; }
  .mpdf-doc ul, .mpdf-doc ol { padding-inline-start: 1.4em; margin: 0 0 0.65em; }
  .mpdf-doc li { margin-bottom: 0.2em; line-height: 1.85; }
  .mpdf-doc blockquote {
    border-inline-start: 3px solid #7c6af7;
    background: transparent;
    padding-block: 4px;
    padding-inline: 1em 0;
    margin: 0.65em 0;
    font-style: italic;
    color: #1a1a2ecc;
  }
  .mpdf-doc code {
    font-family: 'Courier New', monospace;
    font-variant-ligatures: none;
    font-size: 0.85em;
    background: #f0f0f8;
    padding: 1px 4px;
    border-radius: 3px;
    color: #7c6af7;
  }
  
  .mpdf-doc pre {
    background: #f0f0f8;
    border-radius: 4px;
    padding: 10px 12px;
    margin: 0 0 0.65em;
    overflow: hidden;
  }
  .mpdf-doc pre code {
    font-family: 'Courier New', monospace;
    font-variant-ligatures: none;
    font-size: 0.85em;
    color: #1a1a2e;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    background: none;
    padding: 0;
  }
  .mpdf-doc hr {
    border: none;
    border-top: 0.5px solid #7c6af744;
    margin: 0.9750000000000001em 0;
  }
  .mpdf-doc img { max-width: 100%; height: auto; display: block; margin: 0.65em auto; }
  .mpdf-doc a { color: #7c6af7;  }
  .mpdf-doc table { width: 100%; border-collapse: collapse; margin: 0 0 0.65em; font-size: 0.92em; }
  .mpdf-doc th {
    background: #f0f0f8;
    color: #0d0d1a;
    padding: 6px 10px;
    text-align: start;
    font-weight: 600;
    border: 0.5px solid #7c6af733;
    font-size: 0.9em;
  }
  .mpdf-doc td { padding: 5px 10px; border: 0.5px solid #1a1a2e22; vertical-align: top; }
  .mpdf-doc tbody tr:nth-child(even) { background: #f0f0f855; }

  /* GFM Alerts (GitHub-style > [!NOTE] blocks). One accent-styled design for
   * all five variants; the title band spans the full alert width via negative
   * margins against the container's content gutter. */
  .mpdf-doc .markdown-alert {
    border-inline-start: 4px solid #7c6af7;
    border-start-start-radius: 0;
    border-start-end-radius: 5px;
    border-end-end-radius: 5px;
    border-end-start-radius: 0;
    background: #7c6af712;
    margin: 0.78em 0;
    padding: 0 14px 9px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px #7c6af722;
    font-style: normal;
  }
  .mpdf-doc .markdown-alert-title {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 0 -14px;
    padding: 7px 12px;
    background: #7c6af728;
    border-bottom: 1px solid #7c6af733;
    font-family: Georgia, serif;
    font-size: 0.8em;
    font-weight: 800;
    font-style: normal;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7c6af7;
    line-height: 1.3;
  }
  .mpdf-doc .markdown-alert-title svg {
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    stroke: #7c6af7;
    fill: none;
    stroke-width: 2;
  }
  .mpdf-doc .markdown-alert-title + * {
    margin-top: 9px;
  }
  .mpdf-doc .markdown-alert > :last-child:not(.markdown-alert-title) {
    margin-bottom: 0;
  }
  /* Nested blockquotes inside alerts keep a subtler indent */
  .mpdf-doc .markdown-alert blockquote {
    border-inline-start-color: #7c6af766;
    background: transparent;
  }

  /* Mermaid diagrams — centre the SVG and prevent it overflowing the content
   * column.  The <style> block inside the SVG is intentionally left untouched;
   * mermaid embeds its own theme CSS there. */
  .mpdf-doc .mermaid {
    display: flex;
    justify-content: center;
    margin: 0.65em 0;
    overflow: hidden;
  }
  .mpdf-doc .mermaid svg {
    max-width: 100%;
    height: auto;
    display: block;
  }
    </style>
</head>
